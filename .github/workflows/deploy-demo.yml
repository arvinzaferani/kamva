name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Gives Pages the permission to deploy and the OIDC token it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy per run; supersede older in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The demo imports `kamvachart`, whose dist is produced by the facade build.
      - name: Build kamvachart
        run: pnpm --filter ./packages/kamvachart build

      - name: Build playground demo
        run: pnpm --filter ./examples/playground build

      - name: Upload static site (Pages artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4